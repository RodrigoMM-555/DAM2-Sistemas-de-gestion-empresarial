<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ingeriar | Acceso</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main class="pantalla-login">
        <form id="formulario-login" class="formulario-login vista-superficie">
            <h1>Acceso a Ingeriar</h1>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="username">
            <label for="contrasena">Contraseña</label>
            <input id="contrasena" name="contrasena" type="password" required autocomplete="current-password">
            <button class="boton boton-crear" type="submit">Entrar</button>
            <p id="error-login" class="error-login" role="alert" hidden></p>
        </form>
    </main>
    <script src="login.js"></script>
</body>
</html>
