<!doctype html>
<!-- Página para crear tablas desde un modelo de texto. -->
<html>
  <head>
    <!-- No se necesitan recursos adicionales en esta página. -->
  </head>
  <body>
    <!-- Título visible. -->
    <h1>Instalador</h1>
    <!-- Envía el modelo al instalador PHP mediante POST. -->
    <form action="api/instalar.php" method="POST">
      <!-- Explicación del contenido esperado. -->
      <p>Introduce aquí tu modelo de datos</p>
      <!-- Área donde se escriben tablas y columnas. -->
      <textarea name="modelo"></textarea>
      <!-- Botón que envía el modelo. -->
      <input type="submit">
    </form>
  </body>
</html>
